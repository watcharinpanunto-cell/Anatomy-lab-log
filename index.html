<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกการปฏิบัติงานประจำวัน - นักวิทยาศาสตร์</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 600px; background-color: var(--card-bg); min-height: 100vh; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        header { background-color: var(--primary); color: white; padding: 16px; text-align: center; position: sticky; top: 0; z-index: 10; }
        header h1 { font-size: 1.2rem; font-weight: 600; }
        header p { font-size: 0.8rem; opacity: 0.9; }

        nav { display: flex; background-color: white; border-bottom: 1px solid var(--border); }
        nav button { flex: 1; padding: 12px; border: none; background: none; font-weight: 600; color: var(--text-muted); border-bottom: 3px solid transparent; cursor: pointer; }
        nav button.active { color: var(--primary); border-bottom-color: var(--primary); }

        .tab-content { display: none; padding: 16px; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
        input[type="text"], input[type="date"], input[type="number"], select, textarea {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; background-color: #fff; color: var(--text);
        }
        textarea { resize: vertical; min-height: 80px; }
        
        .qty-container { display: flex; gap: 12px; }
        .qty-box { flex: 1; }

        .btn-submit { width: 100%; padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-submit:hover { background-color: var(--primary-hover); }

        /* KPI Card Styles */
        .kpi-card { background: #f1f5f9; border-radius: 8px; padding: 12px; margin-bottom: 12px; border-left: 4px solid var(--primary); }
        .kpi-card h3 { font-size: 0.95rem; display: flex; justify-content: space-between; }
        .kpi-score { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        .progress-bar { height: 8px; background-color: #cbd5e1; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.3s; }

        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 12px; }
        th, td { border: 1px solid var(--border); padding: 8px; text-align: left; }
        th { background-color: #f1f5f9; }
        .status-tag { padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .status-completed { background: #dcfce7; color: var(--success); }
        .status-progress { background: #fef3c7; color: var(--warning); }
        .status-pending { background: #fee2e2; color: var(--danger); }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Anatomy Lab Daily Log</h1>
        <p>บันทึกงานประจำวัน & ประมวลผล KPI นักวิทยาศาสตร์</p>
    </header>

    <nav>
        <button class="active" onclick="switchTab(event, 'logTab')">📝 บันทึกงาน</button>
        <button onclick="switchTab(event, 'historyTab')">📋 รายการบันทึก</button>
        <button onclick="switchTab(event, 'kpiTab')">📊 สรุป KPI</button>
    </nav>

    <!-- TAB 1: FORM -->
    <div id="logTab" class="tab-content active">
        <form id="dailyForm" onsubmit="saveLog(event)">
            <div class="form-group">
                <label>วันที่ปฏิบัติงาน</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label>รหัสวิชา / กิจกรรม</label>
                <input type="text" id="subjectCode" placeholder="เช่น MD011, Basic Human Anatomy" required>
            </div>

            <div class="form-group">
                <label>หมวดหมู่ KPI</label>
                <select id="kpiCategory" required>
                    <option value="S1">S1: ความครบถ้วนของแผนเตรียมปฏิบัติการ</option>
                    <option value="S2">S2: ความถูกต้องของรายการร่าง/สื่อ</option>
                    <option value="S3">S3: ความครบถ้วนของการตรวจรับก่อน-หลัง</option>
                    <option value="S4">S4: การติดตามแก้ไขปัญหาตามกำหนด</option>
                    <option value="S5">S5: การทบทวนรายการ/วิธีปฏิบัติงาน</option>
                    <option value="J1">J1: ความพร้อมของห้องก่อนเริ่มเรียน (งานร่วม)</option>
                    <option value="J2">J2: ความครบถ้วนการส่งมอบหลังเรียน (งานร่วม)</option>
                </select>
            </div>

            <div class="form-group">
                <label>รายละเอียดภารกิจ</label>
                <textarea id="taskDesc" placeholder="ระบุสิ่งที่ดำเนินการ..." required></textarea>
            </div>

            <div class="qty-container form-group">
                <div class="qty-box">
                    <label>เป้าหมาย (รายการ/คาบ)</label>
                    <input type="number" id="targetQty" min="1" value="1" required>
                </div>
                <div class="qty-box">
                    <label>สำเร็จจริง (รายการ/คาบ)</label>
                    <input type="number" id="actualQty" min="0" value="1" required>
                </div>
            </div>

            <div class="form-group">
                <label>สถานะงาน</label>
                <select id="status">
                    <option value="Completed">Completed (เสร็จสิ้น)</option>
                    <option value="In Progress">In Progress (กำลังดำเนินการ)</option>
                    <option value="Pending">Pending (ติดตามต่อ)</option>
                </select>
            </div>

            <div class="form-group">
                <label>พนักงานห้องทดลองที่ปฏิบัติงานร่วม</label>
                <input type="text" id="collaborator" placeholder="ชื่อ-นามสกุล (ถ้ามี)">
            </div>

            <div class="form-group" style="display:flex; align-items:center; gap:8px;">
                <input type="checkbox" id="hasIssue" onchange="toggleIssueField()">
                <label for="hasIssue" style="margin:0;">พบปัญหา / ความผิดปกติ</label>
            </div>

            <div class="form-group" id="issueGroup" style="display: none;">
                <label>รายละเอียดปัญหาที่พบ</label>
                <textarea id="issueDetail" placeholder="ระบุปัญหา และแนวทางแก้ไข..."></textarea>
            </div>

            <button type="submit" class="btn-submit">💾 บันทึกข้อมูล</button>
        </form>
    </div>

    <!-- TAB 2: HISTORY -->
    <div id="historyTab" class="tab-content">
        <h2>ประวัติการบันทึกงาน</h2>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>วันที่</th>
                        <th>หมวด</th>
                        <th>ภารกิจ</th>
                        <th>ผลงาน</th>
                        <th>สถานะ</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>

    <!-- TAB 3: KPI SUMMARY -->
    <div id="kpiTab" class="tab-content">
        <h2>สรุปคะแนนประเมิน KPI</h2>
        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:16px;">คำนวณอัตโนมัติจากผลรวม (สำเร็จจริง / เป้าหมาย)</p>

        <div id="kpiList"></div>

        <div style="margin-top:20px; padding:16px; background:#e0f2fe; border-radius:8px;">
            <h3 style="font-size:1rem; color:#0369a1;">คะแนนรวมถ่วงน้ำหนักหมวด S (60%)</h3>
            <p id="totalWeightedScore" style="font-size:1.8rem; font-weight:bold; color:#0284c7; margin-top:8px;">0.00%</p>
        </div>
    </div>
</div>

<script>
    let logs = JSON.parse(localStorage.getItem('lab_logs')) || [
        { date: '2026-10-08', subject: 'MD011', kpi: 'S1', desc: 'วางแผนเตรียมร่างอาจารย์ใหญ่ 5 กลุ่ม', target: 5, actual: 5, status: 'Completed' },
        { date: '2026-10-08', subject: 'MD011', kpi: 'S2', desc: 'ตรวจความถูกต้องของร่างก่อนสอน', target: 10, actual: 9, status: 'Completed' },
        { date: '2026-10-09', subject: 'Basic Anatomy', kpi: 'S3', desc: 'ตรวจรับร่างหลังเรียน', target: 4, actual: 4, status: 'Completed' }
    ];

    document.getElementById('date').valueAsDate = new Date();

    function switchTab(e, tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        e.target.classList.add('active');

        if(tabId === 'historyTab') renderHistory();
        if(tabId === 'kpiTab') renderKPI();
    }

    function toggleIssueField() {
        const hasIssue = document.getElementById('hasIssue').checked;
        document.getElementById('issueGroup').style.display = hasIssue ? 'block' : 'none';
    }

    function saveLog(e) {
        e.preventDefault();
        const newLog = {
            date: document.getElementById('date').value,
            subject: document.getElementById('subjectCode').value,
            kpi: document.getElementById('kpiCategory').value,
            desc: document.getElementById('taskDesc').value,
            target: parseInt(document.getElementById('targetQty').value),
            actual: parseInt(document.getElementById('actualQty').value),
            status: document.getElementById('status').value,
            collaborator: document.getElementById('collaborator').value,
            issue: document.getElementById('hasIssue').checked ? document.getElementById('issueDetail').value : ''
        };

        logs.push(newLog);
        localStorage.setItem('lab_logs', JSON.stringify(logs));
        alert('บันทึกข้อมูลเรียบร้อยแล้ว!');
        document.getElementById('dailyForm').reset();
        document.getElementById('date').valueAsDate = new Date();
    }

    function renderHistory() {
        const tbody = document.getElementById('historyBody');
        tbody.innerHTML = '';
        logs.slice().reverse().forEach(log => {
            const statusClass = log.status === 'Completed' ? 'status-completed' : (log.status === 'In Progress' ? 'status-progress' : 'status-pending');
            tbody.innerHTML += `
                <tr>
                    <td>${log.date}</td>
                    <td><b>${log.kpi}</b></td>
                    <td>${log.desc}</td>
                    <td>${log.actual}/${log.target}</td>
                    <td><span class="status-tag ${statusClass}">${log.status}</span></td>
                </tr>
            `;
        });
    }

    function renderKPI() {
        const kpiCategories = {
            'S1': 'S1: แผนเตรียมปฏิบัติการ',
            'S2': 'S2: ตรวจสอบความถูกต้องของสื่อ',
            'S3': 'S3: การตรวจรับก่อน-หลังเรียน',
            'S4': 'S4: การติดตามแก้ไขปัญหา',
            'S5': 'S5: การทบทวนวิธีปฏิบัติงาน'
        };

        const kpiListContainer = document.getElementById('kpiList');
        kpiListContainer.innerHTML = '';

        let totalScoreSum = 0;
        let count = 0;

        for (let code in kpiCategories) {
            const categoryLogs = logs.filter(l => l.kpi === code);
            let targetSum = categoryLogs.reduce((sum, l) => sum + l.target, 0);
            let actualSum = categoryLogs.reduce((sum, l) => sum + l.actual, 0);

            let score = targetSum > 0 ? ((actualSum / targetSum) * 100) : 100;
            if (score > 100) score = 100;

            totalScoreSum += score;
            count++;

            kpiListContainer.innerHTML += `
                <div class="kpi-card">
                    <h3><span>${kpiCategories[code]}</span> <span class="kpi-score">${score.toFixed(1)}%</span></h3>
                    <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">ผลงานรวม: ${actualSum} / ${targetSum} รายการ</p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${score}%;"></div>
                    </div>
                </div>
            `;
        }

        let avgSScore = count > 0 ? (totalScoreSum / count) : 0;
        let weightedScore = avgSScore * 0.60;
        document.getElementById('totalWeightedScore').innerText = `${weightedScore.toFixed(2)}% (จากน้ำหนัก 60%)`;
    }
</script>

</body>
</html>
